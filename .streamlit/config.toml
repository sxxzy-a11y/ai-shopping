# 智购参谋 —— Streamlit 主题配置
#
# 这里用 Streamlit 官方支持的 [theme] 配置项，是所有样式里最稳的一层。
# 更细的控制（深色侧栏、卡片、图标块）由 src/ui/theme.py 注入的 CSS 承担，
# 那部分只挂在标准 HTML 标签、稳定类名和极少数 data-testid 上，
# 不触碰 st-emotion-cache-* 这类发版就会变的哈希类名。

[theme]
# 主操作色：与登录页一致的琥珀
primaryColor = "#D3923C"
# 页面底色：暖纸色，让暖白卡片浮起来
# 未登录时 theme.py 会把主容器在登录页渲染前压成暖黑，避免浅色骨架停留太久。
backgroundColor = "#F5F3EE"
# 控件底色：暖白，在纸色页面上仍清晰
secondaryBackgroundColor = "#FFFEFA"
# 正文色
textColor = "#1F1D18"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
