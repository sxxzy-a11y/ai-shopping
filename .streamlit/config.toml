# 智购参谋 —— Streamlit 主题配置
#
# 这里用 Streamlit 官方支持的 [theme] 配置项，是所有样式里最稳的一层。
# 更细的控制（深色侧栏、卡片、图标块）由 src/ui/theme.py 注入的 CSS 承担，
# 那部分只挂在标准 HTML 标签、稳定类名和极少数 data-testid 上，
# 不触碰 st-emotion-cache-* 这类发版就会变的哈希类名。

[theme]
# 主操作色（也是侧栏当前页按钮的底色）
primaryColor = "#2563EB"
# 页面底色：浅灰，让白色卡片浮起来
backgroundColor = "#F7F9FC"
# 控件底色：纯白，在浅灰页面上仍清晰
secondaryBackgroundColor = "#FFFFFF"
# 正文色
textColor = "#101828"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
