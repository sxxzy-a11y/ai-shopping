# 智购参谋 —— 开发工具配置
#
# lint 与格式均已全量收敛（2026-11-06），CI 里的 `ruff check` 与
# `ruff format --check` 都是阻断门禁。
# mypy 仍有 13 处可选值语义错误（eval 断言与页面里的 `Demand | None`），
# 需逐个确认业务意图才能改，故在 CI 里暂为信息性步骤。

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".tmp",
    "pytest-of-*",
    "submission/node_modules",
]

[tool.ruff.lint]
# ruff 默认的完整规则集：语法错误、未定义名、未使用导入/变量、
# 冗余 f-string 等。全部 28 处历史问题已在 2026-11-06 收敛完毕。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` 里的导入是给外部用的重导出，不该按 F401 删掉。
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 目前仍有十余处类型错误，CI 中作为信息性步骤运行；修完后逐步加严。
warn_unused_ignores = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
