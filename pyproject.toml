# 智购参谋 —— 开发工具配置
#
# lint、格式与类型检查均已全量收敛（2026-11-07），CI 里的 `ruff check`、
# `ruff format --check` 与 `mypy src` 都是阻断门禁。
# 仅覆盖率仍是信息性 job（尚未设下限）。

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".tmp",
    "pytest-of-*",
    "submission/node_modules",
]

[tool.ruff.lint]
# ruff 默认的完整规则集：语法错误、未定义名、未使用导入/变量、
# 冗余 f-string 等。全部 28 处历史问题已在 2026-11-06 收敛完毕。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` 里的导入是给外部用的重导出，不该按 F401 删掉。
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 已零错误并作为 CI 阻断门禁。`warn_unused_ignores` 暂关：项目里有少量
# 针对 mypy 无法跟随布尔标志的局部 ignore，开启后会产生噪声。
warn_unused_ignores = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
