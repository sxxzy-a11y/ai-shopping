name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 阻断门禁：当前代码全部能通过，任何一项红了都必须修。
  # --------------------------------------------------------------------------
  test:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Evaluation CLI smoke test
        run: python -m eval.runner --write eval-smoke.md

      # P0-2 回归：Windows 默认 GBK 控制台曾因报告里的 ✅ 抛 UnicodeEncodeError。
      # 用 --write 避免中文类别参数在 pwsh 下的编码差异。
      - name: Evaluation CLI on narrow-encoding console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'gbk'
          python -m eval.runner --write eval-smoke-gbk.md

  # --------------------------------------------------------------------------
  # 信息性：现状未收敛，先持续暴露差距，不阻断合并。
  # 收敛后删掉 continue-on-error，把三步提升为阻断门禁。
  # --------------------------------------------------------------------------
  quality:
    name: quality (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # 剩余 13 处均为可选值语义（eval 断言与页面的 Demand | None），
      # 需逐个确认业务意图后才能改；收敛后再把本 job 转为阻断。
      - name: Type check
        run: mypy src
      - name: Coverage report
        run: pytest --cov=src --cov-report=term-missing -q

  # --------------------------------------------------------------------------
  # 依赖漏洞扫描：只扫运行时依赖（部署镜像里装的那一组）。
  # 信息性——首次运行可能因漏洞库波动或上游公告而红，确认口径后再转阻断。
  # --------------------------------------------------------------------------
  security:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  # --------------------------------------------------------------------------
  # P0-4：本机没有 Docker，Dockerfile 从未实际构建过（见 DEPLOY.md）。
  # 借 CI 的 ubuntu runner 首次验证；确认通过后再去掉 continue-on-error。
  # --------------------------------------------------------------------------
  docker:
    name: docker build + healthcheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zhigou:ci .
      - name: Start container
        run: docker run -d --name zhigou-ci -p 8501:8501 zhigou:ci
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs zhigou-ci
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f zhigou-ci
