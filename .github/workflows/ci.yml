name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 阻断门禁：当前代码全部能通过，任何一项红了都必须修。
  # --------------------------------------------------------------------------
  test:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # 静态类型检查只在 py3.12 跑一次：类型目标版本由 pyproject 的
      # `python_version = "3.11"` 决定，与运行矩阵无关；py3.11 运行时下 mypy
      # 对本项目依赖的 stub 解析会报差异（同一份代码在 3.12/3.13 上均零错误）。
      # 若后续确认 3.11 的报错是真问题，再加回全矩阵。
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy src

      - name: Unit tests
        run: pytest -q

      - name: Evaluation CLI smoke test
        run: python -m eval.runner --write eval-smoke.md

      # P0-2 回归：Windows 默认 GBK 控制台曾因报告里的 ✅ 抛 UnicodeEncodeError。
      # 用 --write 避免中文类别参数在 pwsh 下的编码差异。
      - name: Evaluation CLI on narrow-encoding console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'gbk'
          python -m eval.runner --write eval-smoke-gbk.md

  # --------------------------------------------------------------------------
  # 信息性：现状未收敛，先持续暴露差距，不阻断合并。
  # 收敛后删掉 continue-on-error，把三步提升为阻断门禁。
  # --------------------------------------------------------------------------
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # 目前只输出报告、未设下限；补出基线后加 --cov-fail-under 并转为阻断。
      - name: Coverage report
        run: pytest --cov=src --cov-report=term-missing -q

  # --------------------------------------------------------------------------
  # 依赖漏洞扫描：只扫运行时依赖（部署镜像里装的那一组）。
  # 信息性：已知 23 项来自 pillow 12.3.0、1 项来自 pyarrow 21.0.0，两者受
  # streamlit 1.51.0 的 `pillow<13` / `pyarrow<22` 硬约束，无法升级；
  # 说明见 SECURITY.md「已知依赖漏洞」。streamlit 放宽约束后再转阻断。
  # --------------------------------------------------------------------------
  security:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        env:
          # requirements.txt 含中文注释；Windows 用 GBK locale 解析会 UnicodeDecodeError。
          PYTHONUTF8: "1"
        run: pip-audit -r requirements.txt

  # --------------------------------------------------------------------------
  # P0-4：Docker 镜像构建 + 健康检查。
  # 2026-11-07 首次 CI 运行已通过（构建成功 + /_stcore/health 返回 200），
  # 因此转为阻断门禁。
  # --------------------------------------------------------------------------
  docker:
    name: docker build + healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zhigou:ci .
      - name: Start container
        run: docker run -d --name zhigou-ci -p 8501:8501 zhigou:ci
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs zhigou-ci
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f zhigou-ci
