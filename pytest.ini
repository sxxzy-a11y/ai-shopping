[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
# 只把「本项目代码自己触发」的弃用警告升级为错误。
#
# 原来写的是全局 `error::DeprecationWarning`：只要任何一个第三方依赖在我们
# 不控制的代码里发出弃用告警，整批测试就会变红。实际后果是 CI 的 py3.11 矩阵
# 长期失败——同一份代码在 3.12 / 3.13 上全绿，说明那是上游依赖在旧解释器上的
# 告警，不是本项目用了弃用 API。
#
# 这里收窄到发出警告的模块名以 `src.` 开头：本项目自己写进弃用 API 仍然会
# 立刻失败，而上游的告警不再由本项目的 CI 承担。
filterwarnings =
    error::DeprecationWarning:src\..*
